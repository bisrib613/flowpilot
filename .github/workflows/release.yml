name: Release Flowpilot

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build
        required: true
        default: v1.3.0
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || 'v1.3.0' }}
          releaseName: Flowpilot ${{ inputs.tag || 'v1.3.0' }}
          releaseBody: Multi-service desktop workspace for Flow, Dola, Leonardo AI, ChatGPT, and Migoo.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
