name: Verify Flowpilot PR (Windows)

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    name: Frontend, Rust tests, and NSIS installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm ci
      - name: Set PR-only installer version (after v1.5.5 test build)
        shell: pwsh
        run: |
          $version = "1.5.6"
          npm version $version --no-git-tag-version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $cargoPath = "src-tauri/Cargo.toml"
          $cargo = Get-Content $cargoPath -Raw
          $cargo = [regex]::Replace($cargo, '(?m)^version = "\d+\.\d+\.\d+"', "version = `"$version`"", 1)
          [System.IO.File]::WriteAllText((Resolve-Path $cargoPath).Path, $cargo, [System.Text.UTF8Encoding]::new($false))

          $configPath = "src-tauri/tauri.pr-test.conf.json"
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $config | Add-Member -NotePropertyName version -NotePropertyValue $version -Force
          $config | ConvertTo-Json -Depth 30 | Set-Content $configPath -Encoding utf8NoBOM
      - name: Frontend and command/workspace tests
        run: npm run build
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build Windows NSIS installer
        run: npm run tauri -- build --bundles nsis --config src-tauri/tauri.pr-test.conf.json
      - name: Upload installer for testing (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: flowpilot-windows-pr-test
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
